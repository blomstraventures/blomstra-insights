name: gemini-doc

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Create Docs Output Directory
        run: mkdir -p ./docs-site

      # -------------------------------------------------------------
      # 1. ENHANCED PARSER (PHP + MODERN JS + SIDEBAR + SEARCH)
      # -------------------------------------------------------------
      - name: Parse Source Code Functions
        run: |
          cat << 'EOF' > parse_code.php
          <?php
          $srcDir = './src';
          $outDir = './docs-site';
          if (!is_dir($outDir)) mkdir($outDir, 0777, true);

          $docs = [
              'indices'  => [],
              'shared'   => [],
              'frontend' => [],
          ];

          function extractDocComment(string $content, int $pos): ?string {
              $sub = substr($content, 0, $pos);
              $start = strrpos($sub, '/**');
              if ($start === false) return null;
              $end = strpos($content, '*/', $start);
              if ($end === false || $end < $start) return null;
              $comment = substr($content, $start + 3, $end - $start - 3);
              return trim(preg_replace('/^\s*\*\s?/m', '', $comment));
          }

          function parseFile(string $path, string $type): array {
              $content  = file_get_contents($path);
              $basename = basename($path);
              $ext      = pathinfo($path, PATHINFO_EXTENSION);
              $functions = [];
              $constants = [];
              $pillars   = [];

              if ($ext === 'php') {
                  // PHP Constants
                  preg_match_all("/define\(\s*['\"](\w+)['\"]\s*,\s*['\"]?(.*?)['\"]?\s*\)/", $content, $cm, PREG_SET_ORDER);
                  foreach ($cm as $c) { $constants[] = ['name' => $c[1], 'value' => trim($c[2], "'\"")]; }

                  // PHP Functions
                  preg_match_all('/function\s+(\w+)\s*\((.*?)\)/s', $content, $fm, PREG_OFFSET_CAPTURE);
                  if (!empty($fm[0])) {
                      foreach ($fm[0] as $i => $match) {
                          $name   = $fm[1][$i][0];
                          $params = $fm[2][$i][0];
                          $pos    = $fm[0][$i][1];
                          $doc    = extractDocComment($content, $pos);
                          $functions[] = ['name' => $name, 'params' => trim($params), 'doc' => $doc];
                      }
                  }

                  // Pillar arrays
                  if (preg_match_all("/['\"](\w+)['\"]\s*=>\s*array\(\s*['\"]name['\"]\s*=>\s*['\"](.*?)['\"]/", $content, $pm)) {
                      foreach ($pm[1] as $i => $key) { $pillars[] = ['key' => $key, 'name' => $pm[2][$i]]; }
                  }

              } elseif ($ext === 'js') {
                  // Standard JS Functions + Async
                  preg_match_all('/(?:async\s+)?function\s+(\w+)\s*\((.*?)\)/s', $content, $jm1, PREG_OFFSET_CAPTURE);
                  if (!empty($jm1[0])) {
                      foreach ($jm1[0] as $i => $match) {
                          $functions[] = ['name' => $jm1[1][$i][0], 'params' => trim($jm1[2][$i][0]), 'doc' => extractDocComment($content, $jm1[0][$i][1])];
                      }
                  }

                  // Arrow functions: const myFn = (a, b) => ... or const myFn = async (a, b) => ...
                  preg_match_all('/(?:const|let|var)\s+(\w+)\s*=\s*(?:async\s*)?\((.*?)\)\s*=>/s', $content, $jm2, PREG_OFFSET_CAPTURE);
                  if (!empty($jm2[0])) {
                      foreach ($jm2[0] as $i => $match) {
                          $functions[] = ['name' => $jm2[1][$i][0], 'params' => trim($jm2[2][$i][0]), 'doc' => extractDocComment($content, $jm2[0][$i][1])];
                      }
                  }
              }

              return [
                  'file'      => $basename,
                  'ext'       => $ext,
                  'type'      => $type,
                  'constants' => $constants,
                  'functions' => $functions,
                  'pillars'   => $pillars,
              ];
          }

          if (is_dir($srcDir)) {
              $rii = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($srcDir));
              foreach ($rii as $file) {
                  if ($file->isDir()) continue;
                  $ext = $file->getExtension();
                  if (!in_array($ext, ['php', 'js'])) continue;

                  $path = $file->getPathname();
                  $rel  = str_replace($srcDir . '/', '', $path);
                  $type = str_contains($rel, 'shared') ? 'shared' : (str_contains($rel, 'frontend') ? 'frontend' : 'indices');

                  $parsed = parseFile($path, $type);
                  $docs[$type][] = $parsed;
              }
          }

          file_put_contents("$outDir/api.json", json_encode($docs, JSON_PRETTY_PRINT));

          // BUILD INTERACTIVE SIDEBAR HTML
          $html = '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">';
          $html .= '<title>Blomstra API Reference</title><style>';
          $html .= '* { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; min-height: 100vh; }';
          $html .= '.sidebar { width: 320px; background: #1e293b; border-right: 1px solid #334155; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 1.5rem 1rem; flex-shrink: 0; }';
          $html .= '.search-box { width: 100%; padding: 0.6rem 0.8rem; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; margin-bottom: 1.5rem; }';
          $html .= '.nav-section { margin-bottom: 1.5rem; } .nav-title { font-size: 0.75rem; text-transform: uppercase; color: #64748b; letter-spacing: 0.05em; font-weight: 700; margin-bottom: 0.5rem; }';
          $html .= '.nav-item { display: block; padding: 0.4rem 0.6rem; color: #94a3b8; text-decoration: none; border-radius: 4px; font-size: 0.9rem; margin-bottom: 2px; } .nav-item:hover { background: #334155; color: #60a5fa; }';
          $html .= '.main { flex: 1; padding: 3rem 4rem; max-width: 1000px; }';
          $html .= 'h1 { color: #60a5fa; font-size: 2.2rem; margin-bottom: 0.5rem; } .sub { color: #94a3b8; margin-bottom: 2.5rem; border-bottom: 1px solid #334155; padding-bottom: 1rem; }';
          $html .= '.file-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; } .file-card h2 { color: #34d399; font-size: 1.4rem; margin-bottom: 1rem; }';
          $html .= '.fn-card { background: #0f172a; border-left: 3px solid #60a5fa; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; } .fn-name { font-family: monospace; color: #f59e0b; font-size: 1.05rem; }';
          $html .= '.fn-doc { color: #cbd5e1; font-size: 0.9rem; margin-top: 0.5rem; white-space: pre-wrap; font-family: inherit; }';
          $html .= '.badge { display: inline-block; padding: 2px 6px; font-size: 0.7rem; border-radius: 3px; font-weight: 600; text-transform: uppercase; margin-left: 6px; }';
          $html .= '.badge-php { background: #4f46e5; color: #fff; } .badge-js { background: #d97706; color: #fff; }';
          $html .= '</style></head><body>';

          // SIDEBAR HTML
          $html .= '<div class="sidebar">';
          $html .= '<input type="text" class="search-box" id="search" placeholder="Filter functions..." onkeyup="filterDocs()">';
          
          foreach (['indices' => 'Indices Backend', 'shared' => 'Shared Utilities', 'frontend' => 'Frontend Engine'] as $key => $label) {
              if (!empty($docs[$key])) {
                  $html .= '<div class="nav-section"><div class="nav-title">' . $label . '</div>';
                  foreach ($docs[$key] as $f) {
                      $html .= '<a class="nav-item" href="#file-' . $f['file'] . '">' . $f['file'] . '</a>';
                  }
                  $html .= '</div>';
              }
          }
          $html .= '</div>';

          // MAIN CONTENT HTML
          $html .= '<div class="main">';
          $html .= '<h1>Blomstra API Reference</h1><div class="sub">Auto-extracted code documentation from /src</div>';

          foreach (['indices' => 'Indices Backend (PHP)', 'shared' => 'Shared Utilities (PHP)', 'frontend' => 'Frontend Engine (JS)'] as $key => $sectionTitle) {
              if (empty($docs[$key])) continue;
              $html .= '<h2>' . $sectionTitle . '</h2><br>';

              foreach ($docs[$key] as $f) {
                  $badgeClass = $f['ext'] === 'php' ? 'badge-php' : 'badge-js';
                  $html .= '<div class="file-card" id="file-' . $f['file'] . '">';
                  $html .= '<h2>' . $f['file'] . ' <span class="badge ' . $badgeClass . '">' . strtoupper($f['ext']) . '</span></h2>';

                  if (!empty($f['functions'])) {
                      foreach ($f['functions'] as $fn) {
                          $html .= '<div class="fn-card searchable">';
                          $html .= '<div class="fn-name">' . htmlspecialchars($fn['name']) . '(' . htmlspecialchars($fn['params']) . ')</div>';
                          if (!empty($fn['doc'])) {
                              $html .= '<div class="fn-doc">' . htmlspecialchars($fn['doc']) . '</div>';
                          }
                          $html .= '</div>';
                      }
                  } else {
                      $html .= '<p style="color:#64748b">No explicit functions detected in file.</p>';
                  }
                  $html .= '</div>';
              }
          }

          $html .= '</div>';

          // JS FILTER SCRIPT
          $html .= '<script>
          function filterDocs() {
              let q = document.getElementById("search").value.toLowerCase();
              let cards = document.querySelectorAll(".searchable");
              cards.forEach(card => {
                  let txt = card.textContent.toLowerCase();
                  card.style.display = txt.includes(q) ? "block" : "none";
              });
          }
          </script></body></html>';

          file_put_contents("$outDir/api-reference.html", $html);
          echo "Build complete.\n";
          EOF
          php parse_code.php

      # -------------------------------------------------------------
      # 2. COPY ASSETS & METHODOLOGY (KIMI + MANUAL DOCS)
      # -------------------------------------------------------------
      - name: Copy Supporting Documents & Manual Markdown
        run: |
          mkdir -p ./docs-site/assets
          cp -r assets/* ./docs-site/assets/ 2>/dev/null || true
          if [ -d "docs" ]; then
            cp -r docs/* ./docs-site/ 2>/dev/null || true
          fi

      # -------------------------------------------------------------
      # 3. GENERATE CENTRAL LANDING INDEX (COMBINES BOTH)
      # -------------------------------------------------------------
      - name: Generate Central Landing Index
        run: |
          cat << 'EOF' > ./docs-site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Blomstra Insights — Developer Portal</title>
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; }
                  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; line-height: 1.6; }
                  .hero { text-align: center; padding: 4rem 1.5rem; background: #1e293b; border-bottom: 1px solid #334155; }
                  .hero h1 { font-size: 2.5rem; color: #60a5fa; margin-bottom: 0.5rem; }
                  .hero p { color: #94a3b8; font-size: 1.1rem; }
                  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; max-width: 950px; margin: 3rem auto; padding: 0 1.5rem; }
                  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.8rem; text-decoration: none; color: inherit; transition: transform 0.2s, border-color 0.2s; display: block; }
                  .card:hover { transform: translateY(-4px); border-color: #60a5fa; }
                  .card h3 { color: #34d399; margin-bottom: 0.5rem; font-size: 1.3rem; }
                  .card p { color: #94a3b8; font-size: 0.95rem; }
                  .badge { display: inline-block; margin-top: 1rem; padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; background: rgba(96,165,250,0.15); color: #60a5fa; }
              </style>
          </head>
          <body>
              <div class="hero">
                  <h1>Blomstra Insights — Documentation Hub</h1>
                  <p>Central portal combining human architecture guides and automated code reference.</p>
              </div>
              <div class="grid">
                  <a class="card" href="api-reference.html">
                      <h3>⚡ Interactive Code API Docs</h3>
                      <p>View auto-extracted PHP & JavaScript functions, parameters, and comments with live search.</p>
                      <span class="badge">Auto-Generated</span>
                  </a>
                  <a class="card" href="api.json" download>
                      <h3>📦 Machine API JSON</h3>
                      <p>Download structured JSON schema containing all parsed code functions and metadata.</p>
                      <span class="badge">Raw Data</span>
                  </a>
              </div>
          </body>
          </html>
          EOF

      # -------------------------------------------------------------
      # 4. DISABLE JEKYLL & UPLOAD ARTIFACT
      # -------------------------------------------------------------
      - name: Disable GitHub Pages Jekyll Builder
        run: touch ./docs-site/.nojekyll

      - name: Upload Page Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
