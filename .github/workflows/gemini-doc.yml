name: gemini-doc

on:
  push:
    branches:
      - main
  # Enables manual execution button under the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 1. SETUP ENVIRONMENTS
      # -------------------------------------------------------------
      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JSDoc
        run: npm install -g jsdoc

      # -------------------------------------------------------------
      # 2. GENERATE HTML DOCUMENTATION
      # -------------------------------------------------------------
      - name: Create Target Directories
        run: mkdir -p ./docs/api/php ./docs/api/js

      - name: Run phpDocumentor (Backend PHP -> HTML Site)
        run: |
          wget https://phpdoc.org/phpDocumentor.phar
          php phpDocumentor.phar -d ./src -t ./docs/api/php --ignore="*/vendor/*,*/node_modules/*"

      - name: Run JSDoc (Frontend JS -> HTML Site)
        run: |
          jsdoc -r ./src -d ./docs/api/js --ignore node_modules

      # -------------------------------------------------------------
      # 3. CREATE CENTRAL HUB LANDING PAGE (index.html)
      # -------------------------------------------------------------
      - name: Generate API Hub Index
        run: |
          cat << 'EOF' > ./docs/api/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Blomstra Insights - Developer API Documentation</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
                  .container { text-align: center; background: #1e293b; padding: 3rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 500px; width: 90%; }
                  h1 { margin-bottom: 0.5rem; font-size: 1.8rem; }
                  p { color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem; }
                  .btn-group { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
                  .btn { padding: 0.8rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: bold; color: #fff; transition: all 0.2s; }
                  .btn-php { background: #6366f1; }
                  .btn-js { background: #f59e0b; color: #000; }
                  .btn:hover { transform: translateY(-2px); opacity: 0.9; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Blomstra Insights API Reference</h1>
                  <p>Automated documentation generated by <strong>gemini-doc</strong>.</p>
                  <div class="btn-group">
                      <a class="btn btn-php" href="./php/">🐘 Backend PHP Docs</a>
                      <a class="btn btn-js" href="./js/">⚡ Frontend JS Docs</a>
                  </div>
              </div>
          </body>
          </html>
          EOF

      # -------------------------------------------------------------
      # 4. PUBLISH TO GITHUB PAGES
      # -------------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: PeaceIris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/api
