name: gemini-doc

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Create Docs Output Directory
        run: mkdir -p ./docs-site

      # -------------------------------------------------------------
      # 1. PARSE CODE-LEVEL FUNCTIONS FROM ./src (PHP & JS)
      # -------------------------------------------------------------
      - name: Parse Source Code Functions
        run: |
          php -r '
          $srcDir = "./src";
          $outDir = "./docs-site";
          if (!is_dir($outDir)) mkdir($outDir, 0777, true);

          $docs = [
              "meta" => [
                  "generated" => date("c"),
                  "generator" => "gemini-doc-parser",
                  "version"   => "2.0.0",
              ],
              "indices"  => [],
              "shared"   => [],
              "frontend" => [],
          ];

          function extractDocComment(string $content, int $pos): ?string {
              $start = strrpos(substr($content, 0, $pos), "/**");
              if ($start === false) return null;
              $end = strpos($content, "*/", $start);
              if ($end === false || $end < $start) return null;
              return trim(preg_replace("/^\s*\*\s?/m", "", substr($content, $start + 3, $end - $start - 3)));
          }

          function parseFile(string $path, string $type): array {
              $content  = file_get_contents($path);
              $basename = basename($path);
              $ext      = pathinfo($path, PATHINFO_EXTENSION);
              $fileDoc  = [];

              if (preg_match("/^\s*\/\*\*(.*?)\*\//s", $content, $m)) {
                  $fileDoc["description"] = trim(preg_replace("/^\s*\*\s?/m", "", $m[1]));
              }

              $constants = [];
              $functions = [];
              $pillars   = [];
              $hooks     = [];

              if ($ext === "php") {
                  preg_match_all("/define\(\s*[\'\"](\w+)[\'\"]\s*,\s*[\'\"]?(.*?)[\'\"]?\s*\)/", $content, $cm, PREG_SET_ORDER);
                  foreach ($cm as $c) {
                      $constants[] = ["name" => $c[1], "value" => trim($c[2], "\'\"")];
                  }

                  preg_match_all("/function\s+(\w+)\s*\((.*?)\)/s", $content, $fm, PREG_OFFSET_CAPTURE);
                  foreach ($fm[0] as $i => $match) {
                      $name   = $fm[1][$i][0];
                      $params = $fm[2][$i][0];
                      $pos    = $fm[0][$i][1];
                      $doc    = extractDocComment($content, $pos);
                      $functions[] = ["name" => $name, "params" => trim($params), "doc" => $doc];
                  }

                  if (preg_match_all("/[\'\"](\w+)[\'\"]\s*=>\s*array\(\s*[\'\"]name[\'\"]\s*=>\s*[\'\"](.*?)[\'\"]/", $content, $pm)) {
                      foreach ($pm[1] as $i => $key) {
                          $pillars[] = ["key" => $key, "name" => $pm[2][$i]];
                      }
                  }

                  preg_match_all("/add_action\(\s*[\'\"]([\w_]+)[\'\"]/", $content, $hm);
                  foreach ($hm[1] as $h) { $hooks[] = $h; }

              } elseif ($ext === "js") {
                  preg_match_all("/function\s+(\w+)\s*\((.*?)\)/s", $content, $jm, PREG_OFFSET_CAPTURE);
                  foreach ($jm[0] as $i => $match) {
                      $name   = $jm[1][$i][0];
                      $params = $jm[2][$i][0];
                      $pos    = $jm[0][$i][1];
                      $doc    = extractDocComment($content, $pos);
                      $functions[] = ["name" => $name, "params" => trim($params), "doc" => $doc];
                  }
              }

              return [
                  "file"        => $basename,
                  "extension"   => $ext,
                  "type"        => $type,
                  "description" => $fileDoc["description"] ?? null,
                  "constants"   => $constants,
                  "functions"   => $functions,
                  "pillars"     => $pillars,
                  "hooks"       => array_unique($hooks),
              ];
          }

          if (is_dir($srcDir)) {
              $rii = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($srcDir));
              foreach ($rii as $file) {
                  if ($file->isDir()) continue;
                  $ext = $file->getExtension();
                  if (!in_array($ext, ["php", "js"])) continue;

                  $path = $file->getPathname();
                  $rel  = str_replace($srcDir . "/", "", $path);
                  $type = str_contains($rel, "shared") ? "shared" : (str_contains($rel, "frontend") ? "frontend" : "index");

                  $parsed = parseFile($path, $type);
                  if ($type === "index") {
                      $docs["indices"][] = $parsed;
                  } elseif ($type === "shared") {
                      $docs["shared"][] = $parsed;
                  } else {
                      $docs["frontend"][] = $parsed;
                  }
              }
          }

          file_put_contents("$outDir/api.json", json_encode($docs, JSON_PRETTY_PRINT));

          $md = "# Blomstra Insights — Code-Level API Reference\n\n";
          $md .= "> Auto-generated function-level documentation on " . date("Y-m-d H:i") . " UTC\n\n";

          $md .= "## Indices (PHP Backend)\n\n";
          foreach ($docs["indices"] as $idx) {
              $md .= "### `{$idx["file"]}`\n\n";
              if ($idx["description"]) $md .= "**Description:** {$idx["description"]}\n\n";
              if ($idx["pillars"]) {
                  $md .= "**Pillars Defined:**\n";
                  foreach ($idx["pillars"] as $p) { $md .= "- `{$p["key"]}` — {$p["name"]}\n"; }
                  $md .= "\n";
              }
              $md .= "**Functions Defined (" . count($idx["functions"]) . "):**\n\n";
              foreach ($idx["functions"] as $fn) {
                  $md .= "#### `{$fn["name"]}({$fn["params"]})`\n";
                  if ($fn["doc"]) $md .= "```\n" . $fn["doc"] . "\n```\n";
                  $md .= "\n";
              }
          }

          $md .= "## Shared Utilities (PHP)\n\n";
          foreach ($docs["shared"] as $sh) {
              $md .= "### `{$sh["file"]}`\n\n";
              foreach ($sh["functions"] as $fn) {
                  $md .= "#### `{$fn["name"]}({$fn["params"]})`\n";
                  if ($fn["doc"]) $md .= "```\n" . $fn["doc"] . "\n```\n";
                  $md .= "\n";
              }
          }

          $md .= "## Frontend Engine (JavaScript)\n\n";
          foreach ($docs["frontend"] as $fe) {
              $md .= "### `{$fe["file"]}`\n\n";
              foreach ($fe["functions"] as $fn) {
                  $md .= "#### `{$fn["name"]}({$fn["params"]})`\n";
                  if ($fn["doc"]) $md .= "```\n" . $fn["doc"] . "\n```\n";
                  $md .= "\n";
              }
          }

          file_put_contents("$outDir/api-reference.md", $md);
          '

      # -------------------------------------------------------------
      # 2. COPY ASSETS & METHODOLOGY
      # -------------------------------------------------------------
      - name: Copy Supporting Documents
        run: |
          mkdir -p ./docs-site/assets
          cp -r assets/* ./docs-site/assets/ 2>/dev/null || true
          if [ -f "public-methodology.md" ]; then
            cp public-methodology.md ./docs-site/
          fi

      # -------------------------------------------------------------
      # 3. CONVERT MARKDOWN TO HTML
      # -------------------------------------------------------------
      - name: Convert Markdown Files to HTML
        run: |
          php -r '
          foreach (glob("./docs-site/*.md") as $md) {
              $base = basename($md, ".md");
              $text = file_get_contents($md);
              $text = htmlspecialchars($text, ENT_QUOTES, "UTF-8");
              $text = preg_replace("/^#### (.*)$/m", "<h4>$1</h4>", $text);
              $text = preg_replace("/^### (.*)$/m", "<h3>$1</h3>", $text);
              $text = preg_replace("/^## (.*)$/m", "<h2>$2</h2>", $text);
              $text = preg_replace("/^# (.*)$/m", "<h1>$1</h1>", $text);
              $text = preg_replace("/\*\*(.*?)\*\*/", "<strong>$1</strong>", $text);
              $text = preg_replace("/```(.*?)```/s", "<pre><code>$1</code></pre>", $text);
              $text = preg_replace("/`(.*?)`/", "<code>$1</code>", $text);
              $text = preg_replace("/^- (.*)$/m", "<li>$1</li>", $text);
              $text = nl2br($text);
              
              $html = "<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><title>$base</title><style>";
              $html .= "body{font-family:system-ui,-apple-system,sans-serif;max-width:950px;margin:2rem auto;padding:0 1.5rem;background:#0f172a;color:#e2e8f0;line-height:1.7}";
              $html .= "h1,h2,h3,h4{color:#60a5fa;border-bottom:1px solid #334155;padding-bottom:.3rem}";
              $html .= "code{background:#1e293b;padding:.15rem .4rem;border-radius:4px;color:#f59e0b}";
              $html .= "pre{background:#1e293b;padding:1rem;border-radius:8px;overflow-x:auto}";
              $html .= "pre code{color:#e2e8f0;background:transparent;padding:0}";
              $html .= "ul{padding-left:1.5rem}";
              $html .= "</style></head><body>$text</body></html>";
              
              file_put_contents("./docs-site/$base.html", $html);
          }
          '

      # -------------------------------------------------------------
      # 4. GENERATE LANDING PAGE INDEX
      # -------------------------------------------------------------
      - name: Generate Central Landing Index
        run: |
          cat << 'EOF' > ./docs-site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Blomstra Insights — Developer API</title>
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; }
                  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; line-height: 1.6; }
                  .hero { text-align: center; padding: 4rem 1.5rem; background: #1e293b; border-bottom: 1px solid #334155; }
                  .hero h1 { font-size: 2.5rem; color: #60a5fa; margin-bottom: 0.5rem; }
                  .hero p { color: #94a3b8; font-size: 1.1rem; }
                  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; max-width: 950px; margin: 3rem auto; padding: 0 1.5rem; }
                  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.8rem; text-decoration: none; color: inherit; transition: transform 0.2s, border-color 0.2s; display: block; }
                  .card:hover { transform: translateY(-4px); border-color: #60a5fa; }
                  .card h3 { color: #34d399; margin-bottom: 0.5rem; font-size: 1.3rem; }
                  .card p { color: #94a3b8; font-size: 0.95rem; }
                  .badge { display: inline-block; margin-top: 1rem; padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; background: rgba(96,165,250,0.15); color: #60a5fa; }
              </style>
          </head>
          <body>
              <div class="hero">
                  <h1>Blomstra Insights — Developer API</h1>
                  <p>Function-level documentation generated directly from source code by <strong>gemini-doc</strong>.</p>
              </div>
              <div class="grid">
                  <a class="card" href="api-reference.html">
                      <h3>⚡ Code-Level API Docs</h3>
                      <p>View parsed PHP functions, JSDoc definitions, hooks, constants, and parameters.</p>
                      <span class="badge">Function Level</span>
                  </a>
                  <a class="card" href="public-methodology.html">
                      <h3>📘 Methodology Standard</h3>
                      <p>Public methodology, data sources, normalization rules, and BMS-1.0.0 specs.</p>
                      <span class="badge">Reference</span>
                  </a>
                  <a class="card" href="api.json" download>
                      <h3>📦 Machine JSON Output</h3>
                      <p>Download structured JSON dataset containing all parsed source code metadata.</p>
                      <span class="badge">Raw Data</span>
                  </a>
              </div>
          </body>
          </html>
          EOF

      # -------------------------------------------------------------
      # 5. DISABLE JEKYLL & UPLOAD ARTIFACT
      # -------------------------------------------------------------
      - name: Disable GitHub Pages Jekyll Builder
        run: touch ./docs-site/.nojekyll

      - name: Upload Page Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
