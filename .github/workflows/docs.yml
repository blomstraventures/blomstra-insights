name: Generate Blomstra API Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'assets/**'
      - 'public-methodology.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Parse source code
        run: php scripts/generate-docs.php ./src ./docs-site

      - name: Copy public methodology
        run: |
          mkdir -p ./docs-site/assets
          cp -r assets/* ./docs-site/assets/ 2>/dev/null || true
          if [ -f "public-methodology.md" ]; then
            cp public-methodology.md ./docs-site/
          fi

      - name: Convert Markdown to HTML
        run: |
          php -r '
          foreach (glob("./docs-site/*.md") as $md) {
              $base = basename($md, ".md");
              $text = file_get_contents($md);
              $text = htmlspecialchars($text, ENT_QUOTES, "UTF-8");
              $text = preg_replace("/^###### (.*)$/m", "<h6>$1</h6>", $text);
              $text = preg_replace("/^##### (.*)$/m", "<h5>$1</h5>", $text);
              $text = preg_replace("/^#### (.*)$/m", "<h4>$1</h4>", $text);
              $text = preg_replace("/^### (.*)$/m", "<h3>$1</h3>", $text);
              $text = preg_replace("/^## (.*)$/m", "<h2>$1</h2>", $text);
              $text = preg_replace("/^# (.*)$/m", "<h1>$1</h1>", $text);
              $text = preg_replace("/\*\*(.*?)\*\*/", "<strong>$1</strong>", $text);
              $text = preg_replace("/\*(.*?)\*/", "<em>$1</em>", $text);
              $text = preg_replace("/```(.*?)```/s", "<pre><code>$1</code></pre>", $text);
              $text = preg_replace("/`(.*?)`/", "<code>$1</code>", $text);
              $text = preg_replace("/^- (.*)$/m", "<li>$1</li>", $text);
              $text = preg_replace("/(<li>.*<\/li>\n)+/s", "<ul>$0</ul>", $text);
              $text = preg_replace("/\[([^\]]+)\]\(([^)]+)\)/", "<a href=\"$2\">$1</a>", $text);
              $text = nl2br($text);
              $html = "<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><title>" . $base . "</title><style>";
              $html .= "body{font-family:system-ui,-apple-system,sans-serif;max-width:900px;margin:2rem auto;padding:0 1.5rem;background:#0f172a;color:#e2e8f0;line-height:1.7;font-size:16px}";
              $html .= "h1,h2,h3{color:#60a5fa;border-bottom:1px solid #334155;padding-bottom:.3rem}";
              $html .= "h1{font-size:1.8rem}h2{font-size:1.4rem}h3{font-size:1.15rem}";
              $html .= "a{color:#34d399;text-decoration:none}a:hover{text-decoration:underline}";
              $html .= "code{background:#1e293b;padding:.15rem .4rem;border-radius:4px;font-size:.9em}";
              $html .= "pre{background:#1e293b;padding:1rem;border-radius:8px;overflow-x:auto}";
              $html .= "pre code{background:transparent;padding:0}";
              $html .= "table{border-collapse:collapse;width:100%;margin:1rem 0;font-size:.9em}";
              $html .= "th,td{border:1px solid #334155;padding:.5rem .75rem;text-align:left}";
              $html .= "th{background:#1e293b;color:#94a3b8}";
              $html .= "tr:nth-child(even){background:#1e293b30}";
              $html .= "img{max-width:100%;border-radius:8px}";
              $html .= "ul{padding-left:1.5rem}";
              $html .= "details{background:#1e293b;padding:1rem;border-radius:8px;margin:1rem 0}";
              $html .= "summary{cursor:pointer;font-weight:600;color:#fbbf24}";
              $html .= "blockquote{border-left:3px solid #60a5fa;margin:1rem 0;padding-left:1rem;color:#94a3b8}";
              $html .= "</style></head><body>";
              $html .= $text;
              $html .= "</body></html>";
              file_put_contents("./docs-site/$base.html", $html);
              echo "Converted: $md -> $base.html\n";
          }
          '

      - name: Create landing page
        run: |
          cat << 'EOF' > ./docs-site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Blomstra Insights — Developer Docs</title>
              <style>
                  *{margin:0;padding:0;box-sizing:border-box}
                  body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#f8fafc;line-height:1.6}
                  .hero{text-align:center;padding:5rem 2rem 3rem;background:linear-gradient(180deg,#1e293b 0%,#0f172a 100%);border-bottom:1px solid #334155}
                  .hero h1{font-size:2.8rem;margin-bottom:.5rem;background:linear-gradient(90deg,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
                  .hero p{color:#94a3b8;font-size:1.1rem;max-width:600px;margin:0 auto}
                  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem;max-width:1000px;margin:3rem auto;padding:0 2rem}
                  .card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:2rem;transition:all .2s;text-decoration:none;color:inherit;display:block}
                  .card:hover{transform:translateY(-4px);border-color:#60a5fa;box-shadow:0 10px 30px rgba(96,165,250,.1)}
                  .card h3{color:#60a5fa;margin-bottom:.5rem;font-size:1.3rem}
                  .card p{color:#94a3b8;font-size:.95rem;margin-bottom:1rem}
                  .badge{display:inline-block;padding:.25rem .6rem;border-radius:4px;font-size:.75rem;font-weight:600}
                  .bg-green{background:rgba(52,211,153,.15);color:#34d399}
                  .bg-blue{background:rgba(96,165,250,.15);color:#60a5fa}
                  .bg-amber{background:rgba(251,191,36,.15);color:#fbbf24}
                  .bg-purple{background:rgba(168,85,247,.15);color:#a855f7}
                  footer{text-align:center;padding:3rem 2rem;color:#64748b;border-top:1px solid #334155;margin-top:3rem}
                  .meta{font-size:.85rem;color:#475569;margin-top:.5rem}
              </style>
          </head>
          <body>
              <div class="hero">
                  <h1>Blomstra Insights</h1>
                  <p>Developer documentation, API reference, and methodology for SERI, SIVI, and the Blomstra Methodology Standard.</p>
              </div>
              <div class="grid">
                  <a class="card" href="public-methodology.html">
                      <h3>Public Methodology</h3>
                      <p>Transparent, citable methodology. Data sources, normalization rules, percentile ranks, and research ethics.</p>
                      <span class="badge bg-green">For Researchers</span>
                  </a>
                  <a class="card" href="api-reference.html">
                      <h3>API Reference</h3>
                      <p>Auto-generated from source code. Functions, constants, pillars, hooks, and parameters.</p>
                      <span class="badge bg-blue">For Developers</span>
                  </a>
                  <a class="card" href="api.json" download>
                      <h3>Machine-Readable JSON</h3>
                      <p>Structured export of all parsed code. Build integrations, IDE plugins, or custom dashboards.</p>
                      <span class="badge bg-purple">JSON API</span>
                  </a>
                  <a class="card" href="https://github.com/blomstraventures/blomstra-insights">
                      <h3>Source Code</h3>
                      <p>View the latest source on GitHub. Documentation auto-updates on every push.</p>
                      <span class="badge bg-amber">GitHub</span>
                  </a>
              </div>
              <footer>
                  <p>Auto-generated from <code>blomstra-insights</code> source</p>
                  <p class="meta">Methodology standard: BMS-1.0.0</p>
              </footer>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
